// Lee el Google Sheet en vivo (compartido como "cualquiera con el vínculo puede
// ver") por el endpoint gviz, que devuelve JSON con CORS. Si falla, usa el
// snapshot data/datos.json que genera scripts/actualizar_datos.py.

const SHEET_ID = '1VgeNrhXZD44jZlBDd6pyKuE501tjJbZyH5f1-l4lukw';
const SHEET_RESULTADOS = 'Resultados';
const SHEET_JUGADORES = 'Jugadores';
const RESPALDO_URL = 'data/datos.json';

async function fetchSheet(nombre) {
  const url = `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:json&headers=1&sheet=${encodeURIComponent(nombre)}`;
  const res = await fetch(url, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status} leyendo la hoja "${nombre}"`);
  const txt = await res.text();
  const json = JSON.parse(txt.slice(txt.indexOf('{'), txt.lastIndexOf('}') + 1));
  if (json.status !== 'ok') throw new Error(`Google devolvió "${json.status}" para la hoja "${nombre}"`);
  return json.table;
}

// 'Date(2025,10,20)' (mes 0-based) -> '2025-11-20'
function gvizDateToIso(v) {
  if (v instanceof Date) return v.toISOString().slice(0, 10);
  const m = typeof v === 'string' && v.match(/Date\((\d+),(\d+),(\d+)/);
  if (m) return `${m[1]}-${String(+m[2] + 1).padStart(2, '0')}-${String(m[3]).padStart(2, '0')}`;
  return String(v).slice(0, 10);
}

function parseResultados(table) {
  const cols = table.cols.map(c => c.label || '');
  const idx = {};
  for (const n of ['Fecha', 'Equipo', 'Jugador', 'Resultado', 'Puntos', 'Partido']) {
    idx[n] = cols.indexOf(n);
    if (idx[n] < 0) throw new Error(`Falta la columna "${n}" en la hoja ${SHEET_RESULTADOS}`);
  }
  const out = [];
  for (const row of table.rows) {
    const c = row.c || [];
    const get = n => (c[idx[n]] ? c[idx[n]].v : null);
    const fecha = get('Fecha'), jugador = get('Jugador');
    if (!fecha || !jugador) continue;
    out.push({
      fecha:     gvizDateToIso(fecha),
      equipo:    String(get('Equipo') || '').trim(),
      jugador:   String(jugador).trim(),
      resultado: String(get('Resultado') || '').trim(),
      puntos:    Number(get('Puntos')) || 0,
      partido:   Number(get('Partido')) || 0,
    });
  }
  return out;
}

function parseJugadores(table) {
  const out = [];
  for (const row of table.rows) {
    const v = row.c && row.c[0] ? row.c[0].v : null;
    if (v) out.push(String(v).trim());
  }
  return out;
}

async function loadLive() {
  const [tr, tj] = await Promise.all([fetchSheet(SHEET_RESULTADOS), fetchSheet(SHEET_JUGADORES)]);
  return { resultados: parseResultados(tr), jugadores: parseJugadores(tj) };
}

async function loadRespaldo() {
  const res = await fetch(RESPALDO_URL, { cache: 'no-store' });
  if (!res.ok) throw new Error(`HTTP ${res.status} leyendo ${RESPALDO_URL}`);
  return res.json();
}

function setFooter(text, warn) {
  const f = document.getElementById('footer-info');
  if (!f) return;
  f.textContent = text;
  f.classList.toggle('footer-warn', !!warn);
}

window.addEventListener('DOMContentLoaded', async () => {
  try {
    const data = await loadLive();
    const hora = new Date().toLocaleTimeString('es-AR', { hour: '2-digit', minute: '2-digit' });
    bootstrap(data);
    setFooter(`Datos en vivo del Google Sheet · ${hora}`, false);
  } catch (errLive) {
    console.warn('No se pudo leer el Sheet en vivo, uso el respaldo:', errLive);
    try {
      const data = await loadRespaldo();
      bootstrap(data);
      const cuando = data.actualizado ? fmtFecha(String(data.actualizado).slice(0, 10)) : 'fecha desconocida';
      setFooter(`Sin conexión con el Sheet · datos de respaldo del ${cuando}`, true);
    } catch (errBackup) {
      showError(new Error(`${errLive.message} / respaldo: ${errBackup.message}`));
    }
  }
});

// ---------------- Fondo: Aurora (WebGL2) ----------------
// Port a JS plano del componente <Aurora /> de React Bits (reactbits.dev),
// con la paleta de la página: teal → violeta → verde.
// Devuelve true si quedó andando; false si no hay WebGL2 (se usan las partículas).

const AURORA_OPTS = {
  colorStops: ['#1EC3C3', '#A78BFA', '#10B981'],
  amplitude: 1,
  blend: 0.5,
  height: 0.45,
  speed: 1,
  scale: 1,
  glow: 0.6,
  brightness: 1,
  layers: 2,
  direction: 'top',
  mouseInteraction: true,
  intro: true,
  opacity: 1,
  lightMode: false,
  dpr: undefined,
};

const AURORA_MAX_STOPS = 5;
const AURORA_MAX_LAYERS = 3;
const AURORA_INTRO_SECONDS = 2.4;

const AURORA_VERTEX = `#version 300 es
in vec2 aPosition;
void main() {
  gl_Position = vec4(aPosition, 0.0, 1.0);
}`;

const AURORA_FRAGMENT = `#version 300 es
precision highp float;
precision highp int;
uniform vec2 uResolution;
uniform float uTime;
uniform vec3 uStops[${AURORA_MAX_STOPS}];
uniform int uStopCount;
uniform float uAmplitude;
uniform float uBlend;
uniform float uHeight;
uniform float uScale;
uniform float uGlow;
uniform float uBrightness;
uniform int uLayers;
uniform float uFlip;
uniform vec3 uPointer;
uniform float uReveal;
uniform float uOpacity;
uniform float uLightMode;
out vec4 outColor;

vec3 permute(vec3 x) {
  return mod(((x * 34.0) + 1.0) * x, 289.0);
}

float snoise(vec2 v) {
  const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
  vec2 i = floor(v + dot(v, C.yy));
  vec2 x0 = v - i + dot(i, C.xx);
  vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
  vec4 x12 = x0.xyxy + C.xxzz;
  x12.xy -= i1;
  i = mod(i, 289.0);
  vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
  vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
  m = m * m;
  m = m * m;
  vec3 x = 2.0 * fract(p * C.www) - 1.0;
  vec3 h = abs(x) - 0.5;
  vec3 ox = floor(x + 0.5);
  vec3 a0 = x - ox;
  m *= 1.79284291400159 - 0.85373472095314 * (a0 * a0 + h * h);
  vec3 g;
  g.x = a0.x * x0.x + h.x * x0.y;
  g.yz = a0.yz * x12.xz + h.yz * x12.yw;
  return 130.0 * dot(m, g);
}

float smootherstep(float edge0, float edge1, float x) {
  float t = clamp((x - edge0) / (edge1 - edge0), 0.0, 1.0);
  return t * t * t * (t * (t * 6.0 - 15.0) + 10.0);
}

vec3 oklabToLinear(vec3 c) {
  float l = c.x + 0.3963377774 * c.y + 0.2158037573 * c.z;
  float m = c.x - 0.1055613458 * c.y - 0.0638541728 * c.z;
  float s = c.x - 0.0894841775 * c.y - 1.2914855480 * c.z;
  l = l * l * l;
  m = m * m * m;
  s = s * s * s;
  return vec3(
    4.0767416621 * l - 3.3077115913 * m + 0.2309699292 * s,
    -1.2684380046 * l + 2.6097574011 * m - 0.3413193965 * s,
    -0.0041960863 * l - 0.7034186147 * m + 1.7076147010 * s
  );
}

vec3 toSrgb(vec3 c) {
  c = clamp(c, 0.0, 1.0);
  return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c));
}

vec3 ramp(float t) {
  float x = clamp(t, 0.0, 1.0) * float(uStopCount - 1);
  int i = int(min(floor(x), float(uStopCount - 2)));
  float f = x - float(i);
  f = f * f * (3.0 - 2.0 * f);
  vec3 lch = mix(uStops[i], uStops[i + 1], f);
  lch.x = mix(lch.x, min(lch.x, 0.7), uLightMode);
  return toSrgb(oklabToLinear(vec3(lch.x, lch.y * cos(lch.z), lch.y * sin(lch.z))));
}

float hash(vec2 p) {
  p = fract(p * vec2(123.34, 456.21));
  p += dot(p, p + 45.32);
  return fract(p.x * p.y);
}

void main() {
  vec2 frag = gl_FragCoord.xy;
  float y = 1.0 - frag.y / uResolution.y;
  y = mix(y, 1.0 - y, uFlip);
  float u = frag.x / uResolution.x;
  float X = (frag.x - uResolution.x * 0.5) / uResolution.y;
  float t = uTime;
  float reach = uPointer.z * exp(-pow((X - uPointer.x) / 0.38, 2.0));

  vec3 glow = vec3(0.0);
  float cover = 0.0;
  for (int k = 0; k < ${AURORA_MAX_LAYERS}; k++) {
    if (k >= uLayers) break;
    float layer = float(k);
    float seed = layer * 13.7;
    float pace = t * (1.0 - layer * 0.18);
    float warp = snoise(vec2(X * 0.45 * uScale + pace * 0.02 + seed, pace * 0.05 + seed));
    float wave = snoise(vec2(X * 0.75 * uScale + warp * 0.35 - pace * 0.03 + seed, pace * 0.07 - seed)) * 0.72
      + snoise(vec2(X * 1.6 * uScale + warp * 0.5 + pace * 0.04 - seed, pace * 0.1 + seed * 0.5)) * 0.28;
    float hem = uHeight + layer * 0.07 + wave * 0.15 * uAmplitude;
    hem += reach * 0.08 * (layer < 0.5 ? 1.0 : 0.4);
    hem = mix(-0.25, hem, uReveal);

    float soft = (0.04 + uBlend * 0.16) * (1.0 + layer * 0.9);
    float rise = hem - y;
    float low = -soft - uGlow * 0.14;
    float high = 0.26 + soft * 0.6;
    float body = pow(smootherstep(low, high, rise), 1.5 + uGlow * 0.6);
    float lobes = 0.86 + 0.14 * snoise(vec2(X * 0.9 * uScale - pace * 0.025 + seed, y * 0.3 + pace * 0.04));
    float alpha = body * lobes * (layer < 0.5 ? 1.0 : 0.32 / layer);
    alpha = clamp(alpha * (1.0 + reach * 0.25 * smootherstep(0.9, 0.0, abs(y - hem))), 0.0, 1.0);

    vec3 tint = ramp(u + 0.05 * sin(pace * 0.08 + layer * 2.3) + layer * 0.1 + max(rise, 0.0) * 0.05);
    glow = 1.0 - (1.0 - glow) * (1.0 - tint * alpha);
    cover = 1.0 - (1.0 - cover) * (1.0 - alpha);
  }

  float fade = smootherstep(0.0, 0.7, uReveal) * uOpacity;
  float strength = clamp(uBrightness, 0.0, 2.0);
  glow *= fade * min(strength, 1.0);
  cover *= fade * min(strength, 1.0);
  glow = 1.0 - pow(1.0 - glow, vec3(max(strength, 1.0)));
  float dither = (hash(frag) - 0.5) / 255.0;

  if (uLightMode > 0.5) {
    vec3 tint = cover > 0.0001 ? glow / cover : vec3(0.0);
    cover *= smootherstep(0.0, 0.25, cover);
    float alpha = cover * 0.7;
    outColor = vec4(tint * alpha + dither, clamp(alpha + dither, 0.0, 1.0));
    return;
  }
  outColor = vec4(glow + dither, clamp(cover + dither, 0.0, 1.0));
}`;

function auroraClamp(v, min, max) { return Math.min(max, Math.max(min, v)); }

function auroraToOklch(rgb) {
  const [r, g, b] = rgb.map(c => (c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4)));
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  const lab = [
    0.2104542553 * l + 0.793617785 * m - 0.0040720468 * s,
    1.9779984951 * l - 2.428592205 * m + 0.4505937099 * s,
    0.0259040371 * l + 0.7827717662 * m - 0.808675766 * s,
  ];
  return [lab[0], Math.hypot(lab[1], lab[2]), Math.atan2(lab[2], lab[1])];
}

function auroraUnwrapHues(stops) {
  const known = stops.findIndex(stop => stop[1] > 0.02);
  const anchor = known === -1 ? 0 : stops[known][2];
  let previous = anchor;
  return stops.map(stop => {
    let hue = stop[1] > 0.02 ? stop[2] : previous;
    while (hue - previous > Math.PI) hue -= Math.PI * 2;
    while (hue - previous < -Math.PI) hue += Math.PI * 2;
    previous = hue;
    return [stop[0], stop[1], hue];
  });
}

function auroraCompile(gl, type, source) {
  const shader = gl.createShader(type);
  if (!shader) return null;
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (gl.getShaderParameter(shader, gl.COMPILE_STATUS)) return shader;
  console.warn('Aurora shader:', gl.getShaderInfoLog(shader));
  gl.deleteShader(shader);
  return null;
}

function auroraLink(gl) {
  const vertex = auroraCompile(gl, gl.VERTEX_SHADER, AURORA_VERTEX);
  const fragment = auroraCompile(gl, gl.FRAGMENT_SHADER, AURORA_FRAGMENT);
  const program = gl.createProgram();
  if (!vertex || !fragment || !program) return null;
  gl.attachShader(program, vertex);
  gl.attachShader(program, fragment);
  gl.bindAttribLocation(program, 0, 'aPosition');
  gl.linkProgram(program);
  gl.deleteShader(vertex);
  gl.deleteShader(fragment);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    gl.deleteProgram(program);
    return null;
  }
  const uniforms = {};
  const count = gl.getProgramParameter(program, gl.ACTIVE_UNIFORMS);
  for (let i = 0; i < count; i++) {
    const info = gl.getActiveUniform(program, i);
    if (info) uniforms[info.name.replace('[0]', '')] = gl.getUniformLocation(program, info.name);
  }
  return { program, uniforms };
}

function initAurora() {
  const canvas = document.getElementById('bg-aurora');
  if (!canvas) return false;
  if (canvas._initialized) return true;
  let gl = null;
  try {
    gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: true, antialias: false, depth: false, stencil: false });
  } catch (_) { gl = null; }
  if (!gl) { canvas.classList.add('hidden'); return false; }
  const program = auroraLink(gl);
  if (!program) { canvas.classList.add('hidden'); return false; }
  canvas._initialized = true;
  document.body.classList.add('aurora-on');
  const u = program.uniforms;

  const o = AURORA_OPTS;
  const stops = (Array.isArray(o.colorStops) ? o.colorStops : []).filter(Boolean).map(String).slice(0, AURORA_MAX_STOPS);
  const s = {
    stops: stops.length >= 2 ? stops : stops.length === 1 ? [stops[0], stops[0]] : ['#1EC3C3', '#A78BFA'],
    amplitude: Math.max(0, o.amplitude),
    blend: auroraClamp(o.blend, 0, 1),
    speed: o.speed,
    height: auroraClamp(o.height, 0, 1),
    scale: Math.max(0.1, o.scale),
    glow: Math.max(0, o.glow),
    brightness: Math.max(0, o.brightness),
    layers: auroraClamp(Math.round(o.layers), 1, AURORA_MAX_LAYERS),
    flip: o.direction === 'bottom' ? 1 : 0,
    mouseInteraction: o.mouseInteraction,
    intro: o.intro,
    opacity: auroraClamp(o.opacity, 0, 1),
    lightMode: o.lightMode,
    dpr: o.dpr,
  };

  const buffer = gl.createBuffer();
  const vao = gl.createVertexArray();
  gl.bindVertexArray(vao);
  gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0);
  gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);

  // Colores → OKLCH (una sola vez, los stops no cambian)
  const probe = document.createElement('canvas').getContext('2d', { willReadFrequently: true });
  const parse = value => {
    if (!probe) return [1, 1, 1];
    probe.clearRect(0, 0, 1, 1);
    probe.fillStyle = '#ffffff';
    probe.fillStyle = value;
    probe.fillRect(0, 0, 1, 1);
    const [r, g, b] = probe.getImageData(0, 0, 1, 1).data;
    return [r / 255, g / 255, b / 255];
  };
  const palette = new Float32Array(AURORA_MAX_STOPS * 3);
  auroraUnwrapHues(s.stops.map(v => auroraToOklch(parse(v)))).forEach((stop, i) => palette.set(stop, i * 3));

  const reduce = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)').matches : false;
  const view = { width: 1, height: 1 };
  const pointer = { x: 0, y: 0, inside: false };
  const state = { clock: 0, px: 0, py: 0.5, reach: 0, reveal: s.intro && !reduce ? 0 : 1 };
  let raf = 0;
  let last = 0;

  function render() {
    gl.viewport(0, 0, canvas.width, canvas.height);
    gl.useProgram(program.program);
    gl.bindVertexArray(vao);
    gl.uniform2f(u.uResolution, canvas.width, canvas.height);
    gl.uniform1f(u.uTime, state.clock);
    gl.uniform3fv(u.uStops, palette);
    gl.uniform1i(u.uStopCount, s.stops.length);
    gl.uniform1f(u.uAmplitude, s.amplitude);
    gl.uniform1f(u.uBlend, s.blend);
    gl.uniform1f(u.uHeight, s.height);
    gl.uniform1f(u.uScale, s.scale);
    gl.uniform1f(u.uGlow, s.glow);
    gl.uniform1f(u.uBrightness, s.brightness);
    gl.uniform1i(u.uLayers, s.layers);
    gl.uniform1f(u.uFlip, s.flip);
    gl.uniform3f(u.uPointer, state.px, state.py, state.reach);
    gl.uniform1f(u.uReveal, 1 - Math.pow(1 - state.reveal, 3));
    gl.uniform1f(u.uOpacity, s.opacity);
    gl.uniform1f(u.uLightMode, s.lightMode ? 1 : 0);
    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function frame(now) {
    raf = 0;
    if (document.hidden) return;
    // si el viewport cambió sin disparar resize (pestaña abierta en segundo plano), corregir
    const ratio = Math.min(s.dpr || window.devicePixelRatio || 1, 2);
    if (canvas.width !== Math.max(1, Math.round(window.innerWidth * ratio)) ||
        canvas.height !== Math.max(1, Math.round(window.innerHeight * ratio))) { resize(); return; }
    const dt = last ? auroraClamp((now - last) / 1000, 0.0005, 0.05) : 1 / 60;
    last = now;
    const motion = reduce ? 0 : 1;
    state.clock += dt * s.speed * motion;
    const engaged = s.mouseInteraction && pointer.inside && !reduce;
    const follow = 1 - Math.exp(-dt / 0.6);
    if (engaged) {
      const tx = (pointer.x - view.width / 2) / view.height;
      const ty = s.flip ? 1 - pointer.y / view.height : pointer.y / view.height;
      state.px += (tx - state.px) * follow;
      state.py += (ty - state.py) * follow;
    }
    state.reach += ((engaged ? 1 : 0) - state.reach) * (1 - Math.exp(-dt / (engaged ? 0.9 : 1.4)));
    if (!s.intro || reduce) state.reveal = 1;
    else if (state.reveal < 1) state.reveal = Math.min(1, state.reveal + dt / AURORA_INTRO_SECONDS);
    render();
    // con movimiento reducido alcanza con un cuadro quieto; el puntero lo despierta
    if (!reduce || state.reach > 0.001) raf = requestAnimationFrame(frame);
  }

  function wake() {
    if (!raf && !document.hidden) raf = requestAnimationFrame(frame);
  }

  function resize() {
    const width = Math.max(1, window.innerWidth);
    const height = Math.max(1, window.innerHeight);
    const ratio = Math.min(s.dpr || window.devicePixelRatio || 1, 2);
    view.width = width;
    view.height = height;
    canvas.width = Math.max(1, Math.round(width * ratio));
    canvas.height = Math.max(1, Math.round(height * ratio));
    render();
    wake();
  }

  function onPointerMove(event) {
    pointer.x = event.clientX;
    pointer.y = event.clientY;
    const wasInside = pointer.inside;
    pointer.inside = pointer.x >= 0 && pointer.y >= 0 && pointer.x <= view.width && pointer.y <= view.height;
    if (pointer.inside && !wasInside) {
      state.px = (pointer.x - view.width / 2) / Math.max(1, view.height);
      state.py = s.flip ? 1 - pointer.y / Math.max(1, view.height) : pointer.y / Math.max(1, view.height);
    }
    wake();
  }
  function onPointerUp(event) { if (event.pointerType !== 'mouse') pointer.inside = false; }
  function onPointerLeave() { pointer.inside = false; }
  function onVisibility() { last = 0; wake(); }

  window.addEventListener('resize', resize);
  window.addEventListener('pointermove', onPointerMove, { passive: true });
  window.addEventListener('pointerdown', onPointerMove, { passive: true });
  window.addEventListener('pointerup', onPointerUp, { passive: true });
  window.addEventListener('pointercancel', onPointerUp, { passive: true });
  document.documentElement.addEventListener('pointerleave', onPointerLeave);
  document.addEventListener('visibilitychange', onVisibility);
  resize();
  return true;
}

// ---------------- Background particles ----------------

function initParticles() {
  const canvas = document.getElementById('bg-particles');
  if (!canvas || canvas._initialized) return;
  canvas._initialized = true;
  const ctx = canvas.getContext('2d');
  let w, h, dpr;
  const COUNT = 55;
  const arr = [];

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth;
    h = window.innerHeight;
    canvas.width  = Math.floor(w * dpr);
    canvas.height = Math.floor(h * dpr);
    canvas.style.width = w + 'px';
    canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function spawn(initialY) {
    return {
      x: Math.random() * w,
      y: initialY === undefined ? h + Math.random() * 40 : initialY,
      r: Math.random() * 1.2 + 0.4,
      vx: (Math.random() - 0.5) * 0.12,
      vy: -(Math.random() * 0.28 + 0.07),
      a: Math.random() * 0.22 + 0.06, // alpha base mucho más tenue (0.06–0.28)
      hue: 145 + Math.random() * 45, // verde césped → teal
      drift: Math.random() * Math.PI * 2,
    };
  }
  function step() {
    ctx.clearRect(0, 0, w, h);
    for (const p of arr) {
      p.drift += 0.006;
      p.x += p.vx + Math.sin(p.drift) * 0.18;
      p.y += p.vy;
      if (p.y < -12) { p.y = h + 5; p.x = Math.random() * w; }
      if (p.x < -12) p.x = w + 5;
      if (p.x > w + 12) p.x = -5;
      // halo
      const grd = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 7);
      grd.addColorStop(0, `hsla(${p.hue}, 70%, 55%, ${p.a})`);
      grd.addColorStop(1, `hsla(${p.hue}, 70%, 55%, 0)`);
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r * 7, 0, Math.PI * 2);
      ctx.fill();
      // núcleo (mucho más sutil que antes)
      ctx.fillStyle = `hsla(${p.hue}, 80%, 70%, ${p.a + 0.12})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      ctx.fill();
    }
    requestAnimationFrame(step);
  }
  resize();
  for (let i = 0; i < COUNT; i++) arr.push(spawn(Math.random() * h));
  window.addEventListener('resize', resize);
  requestAnimationFrame(step);
}

// ---------------- Contador tipo odómetro ----------------

function animateNumber(elTarget, to, opts) {
  if (!elTarget) return;
  const o = opts || {};
  const dec = o.dec || 0;
  const dur = o.dur || 750;
  const from = o.from === undefined ? 0 : o.from;
  const start = performance.now();
  const fmt = (v) => dec === 0
    ? Math.round(v).toLocaleString('es-AR')
    : fmtNum(v, dec);
  elTarget.classList.add('counting');
  function frame(now) {
    const t = Math.min(1, (now - start) / dur);
    const eased = 1 - Math.pow(1 - t, 3);
    const v = from + (to - from) * eased;
    elTarget.textContent = fmt(v);
    if (t < 1) requestAnimationFrame(frame);
    else elTarget.textContent = fmt(to);
  }
  requestAnimationFrame(frame);
}

// ---------------- Helpers de racha ----------------

// Devuelve la cantidad de partidos consecutivos (al final) ganados por `name`.
// 0 si la última no fue victoria.
function getCurrentWinStreak(name) {
  const matches = playerMatches(MATCHES, name);
  const cs = currentStreak(matches);
  return (cs.type === 'G') ? cs.count : 0;
}

// Devuelve la cantidad de partidos consecutivos (al final) perdidos por `name`.
// 0 si la última no fue derrota.
function getCurrentLoseStreak(name) {
  const matches = playerMatches(MATCHES, name);
  const cs = currentStreak(matches);
  return (cs.type === 'P') ? cs.count : 0;
}

const STREAK_THRESHOLD = 3; // estrictamente mayor a 3 → 4+


// ---------------- Vista: TABLA ----------------

let standingsSort = { key: 'promedio', dir: 'desc' };

function renderTabla(root) {
  const cols = [
    { key: 'rank',      label: '#',                short: '#',       w: 'col-rank' },
    { key: 'jugador',   label: 'Jugador',          short: 'Jugador', w: 'col-name' },
    { key: 'pj',        label: 'PJ',               short: 'PJ' },
    { key: 'pg',        label: 'PG',               short: 'PG' },
    { key: 'pe',        label: 'PE',               short: 'PE' },
    { key: 'pp',        label: 'PP',               short: 'PP' },
    { key: 'puntos',    label: 'Puntos',           short: 'Pts' },
    { key: 'promedio',  label: 'Puntaje Promedio', short: 'Prom' },
  ];

  // Split en dos grupos: habituales (>5 PJ) y esporádicos (≤5 PJ)
  // Threshold alineado con el de Excel/regularización: PROMEDIO.SI(B; ">"&5; G)
  const habituales  = STANDINGS.filter(s => s.pj > 5);
  const esporadicos = STANDINGS.filter(s => s.pj <= 5);

  function sortGroup(group) {
    return [...group].sort((a, b) => {
      const k = standingsSort.key, dir = standingsSort.dir === 'asc' ? 1 : -1;
      let primary;
      if (k === 'jugador')      primary = a.jugador.localeCompare(b.jugador);
      else if (k === 'rank')    primary = a.rank - b.rank;
      else                      primary = a[k] - b[k];
      if (primary !== 0) return primary * dir;
      // Tie-breakers fijos (independientes del dir primario):
      // promedio desc → puntos desc → pj desc → nombre asc
      return (b.promedio - a.promedio)
          || (b.puntos - a.puntos)
          || (b.pj - a.pj)
          || a.jugador.localeCompare(b.jugador);
    });
  }

  // Heatmaps con escala compartida entre ambas tablas para que sean comparables
  const maxPJ  = Math.max(...STANDINGS.map(p => p.pj), 1);
  const maxAvg = Math.max(...STANDINGS.map(p => p.promedio), 0.001);
  const minAvg = Math.min(...STANDINGS.map(p => p.promedio), 0);

  // KPIs
  const elegiblesTop   = STANDINGS.filter(s => s.pj > 5);
  const topPromedio    = elegiblesTop.length ? [...elegiblesTop].sort((a, b) => b.promedio - a.promedio)[0] : STANDINGS[0];
  const masPuntos      = [...STANDINGS].sort((a, b) => b.puntos - a.puntos)[0];
  const masVictorias   = [...STANDINGS].sort((a, b) => b.pg - a.pg)[0];
  const elegibles      = STANDINGS.filter(s => s.pj > 5);
  const mejorPctG      = elegibles.length
    ? [...elegibles].sort((a, b) => (b.pg / b.pj) - (a.pg / a.pj))[0]
    : null;
  // KPIs negativos
  const peorPromedio   = elegibles.length ? [...elegibles].sort((a, b) => a.promedio - b.promedio)[0] : null;
  const menosPuntos    = elegibles.length ? [...elegibles].sort((a, b) => a.puntos - b.puntos)[0] : null;
  const pairs          = buildPairStats(MATCHES).filter(p => p.pj >= 3);
  const promedioByJugador = new Map(STANDINGS.map(s => [s.jugador, s.promedio]));
  const pairAvgSum = p => (promedioByJugador.get(p.a) || 0) + (promedioByJugador.get(p.b) || 0);
  const masGananJuntos = pairs.length ? [...pairs].sort((a, b) => b.pg - a.pg || pairAvgSum(b) - pairAvgSum(a))[0] : null;
  const masPierdenJuntos = pairs.length ? [...pairs].sort((a, b) => b.pp - a.pp)[0] : null;
  const trios          = buildTrioStats(MATCHES).filter(t => t.pj >= 3);
  const mejorTrio      = trios.length ? [...trios].sort((a, b) => b.pg - a.pg)[0] : null;
  const masPierdenTrio = trios.length ? [...trios].sort((a, b) => b.pp - a.pp)[0] : null;

  root.innerHTML = '';
  root.appendChild(el(`
    <div class="view-header">
      <div>
        <h1 class="view-title">Tabla de posiciones</h1>
        <div class="view-sub">Ordenado por puntaje promedio · click en una columna para reordenar</div>
      </div>
    </div>
  `));

  function buildTable(group, title, emptyMsg) {
    // Badge = macro-average (promedio de los promedios) del grupo visible.
    // Clickeable: alterna entre 2 y 8 decimales.
    const groupAvg  = group.length ? group.reduce((a, p) => a + p.promedio, 0) / group.length : 0;
    const badgeShort = group.length ? `Prom ${fmtNum(groupAvg, 2)}` : 'Sin datos';
    const badgeFull  = group.length ? `Prom ${fmtNum(groupAvg, 8)}` : 'Sin datos';
    const clickable  = group.length ? ' badge-avg' : '';
    const section = el(`
      <section class="standings-section">
        <h2 class="standings-section-title">${esc(title)} <span class="badge${clickable}" data-short="${esc(badgeShort)}" data-full="${esc(badgeFull)}" title="${esc(group.length ? 'Click para ver 8 decimales' : '')}">${esc(badgeShort)}</span></h2>
        <div class="standings-wrap"><table class="standings"><thead><tr></tr></thead><tbody></tbody></table></div>
      </section>
    `);

    const badgeEl = section.querySelector('.badge-avg');
    if (badgeEl) {
      badgeEl.addEventListener('click', () => {
        const expanded = badgeEl.classList.toggle('expanded');
        badgeEl.textContent = expanded ? badgeEl.dataset.full : badgeEl.dataset.short;
        badgeEl.setAttribute('title', expanded ? 'Click para volver' : 'Click para ver 8 decimales');
      });
    }
    const trh = section.querySelector('thead tr');
    cols.forEach(c => {
      const th = el(`<th class="${c.w || ''}"><span class="lbl-full">${esc(c.label)}</span><span class="lbl-short">${esc(c.short || c.label)}</span></th>`);
      if (c.key === standingsSort.key) th.classList.add('sort-' + standingsSort.dir);
      th.addEventListener('click', () => {
        if (standingsSort.key === c.key) standingsSort.dir = standingsSort.dir === 'desc' ? 'asc' : 'desc';
        else { standingsSort.key = c.key; standingsSort.dir = (c.key === 'jugador' ? 'asc' : 'desc'); }
        renderTabla(root);
      });
      trh.appendChild(th);
    });

    const tbody = section.querySelector('tbody');
    const sorted = sortGroup(group);
    if (sorted.length === 0) {
      tbody.appendChild(el(`<tr><td colspan="${cols.length}" class="standings-empty">${esc(emptyMsg || 'Sin jugadores')}</td></tr>`));
      return section;
    }
    sorted.forEach((p, i) => {
      const tPJ  = p.pj / maxPJ;
      const tAvg = (p.promedio - minAvg) / (maxAvg - minAvg || 1);
      const heatPJ  = lerpHex('#0e3a44', '#1ec3c3', tPJ);
      const heatAvg = lerpHex('#1f4d34', '#4ade80', tAvg);

      const winStreak = getCurrentWinStreak(p.jugador);
      const loseStreak = getCurrentLoseStreak(p.jugador);
      const onStreak = winStreak > STREAK_THRESHOLD;
      const onColdStreak = loseStreak > STREAK_THRESHOLD;
      const fireBadge = onStreak
        ? `<span class="streak-badge" data-count="${winStreak}" title="Racha de ${winStreak} victorias">\u{1F525}</span>`
        : onColdStreak

  });
}

// Interpola dos colores hex y devuelve hex
function lerpHex(a, b, t) {
  t = Math.max(0, Math.min(1, t));
  const pa = [parseInt(a.slice(1,3),16), parseInt(a.slice(3,5),16), parseInt(a.slice(5,7),16)];
  const pb = [parseInt(b.slice(1,3),16), parseInt(b.slice(3,5),16), parseInt(b.slice(5,7),16)];
  const r = pa.map((v, i) => Math.round(v + (pb[i] - v) * t));
  return '#' + r.map(v => v.toString(16).padStart(2, '0')).join('');
}

function matchCard(m) {
  const winnerLabel =
    m.resultadoA === 'G' ? `Ganó A` :
    m.resultadoB === 'G' ? `Ganó B` :
    `Empate`;
  const winnerClass = m.resultadoA === 'G' ? 'A' : (m.resultadoB === 'G' ? 'B' : 'E');

  const node = el(`
    <article class="match" data-key="${esc(matchKey(m))}">
      <div class="match-head">
        <div class="match-date"><strong>${esc(fmtFecha(m.fecha))}</strong>${esc(fmtFechaDia(m.fecha))}</div>
        <div class="match-team left">
          <div class="team-tag A">A</div>
          <div class="team-players">${esc(m.A.join(', '))}</div>
        </div>
        <div class="match-vs">vs</div>
        <div class="match-team right">
          <div class="team-players">${esc(m.B.join(', '))}</div>
          <div class="team-tag B">B</div>
        </div>
        <div class="match-result ${winnerClass}">${esc(winnerLabel)}</div>
      </div>
    </article>
  `);

  const head = node.querySelector('.match-head');
  head.addEventListener('click', () => {
    const opened = node.querySelector('.match-detail');
    if (opened) { opened.remove(); return; }
    const det = el(`
      <div class="match-detail">
        <div>
          <h4>Equipo A · ${esc(m.resultadoA === 'G' ? 'ganó' : m.resultadoA === 'E' ? 'empató' : 'perdió')}</h4>
          <ul>${m.A.map(n => `<li data-name="${esc(n)}">${esc(n)}</li>`).join('')}</ul>
        </div>
        <div>
          <h4>Equipo B · ${esc(m.resultadoB === 'G' ? 'ganó' : m.resultadoB === 'E' ? 'empató' : 'perdió')}</h4>
          <ul>${m.B.map(n => `<li data-name="${esc(n)}">${esc(n)}</li>`).join('')}</ul>
        </div>
      </div>
    `);
    det.querySelectorAll('li').forEach(li => {
      li.addEventListener('click', e => {
        e.stopPropagation();
        navigate('#/jugador/' + encodeURIComponent(li.dataset.name));
      });
    });
    node.appendChild(det);
  });

  return node;
}

function renderProximo(root) {
  root.innerHTML = '';
  let slotCount = loadProximoMode();
  let slots = loadProximoSlots(slotCount);
  let teams = null; // {blanco, negro} cuando se arman

  root.appendChild(el(`
    <div class="view-header">
      <div>
        <h1 class="view-title">Próximo partido</h1>
        <div class="view-sub" id="proximo-sub">Elegí ${slotCount} jugadores y armá los equipos con el método de la serpiente</div>
      </div>
    </div>
  `));

  // Toggle modo 5v5 / 6v6
  const modeWrap = el(`
    <div class="mode-toggle">
      <span class="mode-label ${slotCount === MODE_5V5 ? 'active' : ''}" data-target="5v5">5 vs 5</span>
      <label class="switch" aria-label="Cambiar modo">
        <input type="checkbox" id="mode-input" ${slotCount === MODE_6V6 ? 'checked' : ''}>
        <span class="slider"></span>
      </label>
      <span class="mode-label ${slotCount === MODE_6V6 ? 'active' : ''}" data-target="6v6">6 vs 6</span>
    </div>
  `);
  root.appendChild(modeWrap);

  const modeInput = modeWrap.querySelector('#mode-input');
  modeInput.addEventListener('change', () => {
    const newCount = modeInput.checked ? MODE_6V6 : MODE_5V5;
    saveProximoMode(newCount);
    // Re-renderizar la vista entera con el nuevo modo
    renderProximo(root);
  });
  // También permitir click en los labels para cambiar
  modeWrap.querySelectorAll('.mode-label').forEach(lbl => {
    lbl.addEventListener('click', () => {
      const target = lbl.dataset.target;
      const newCount = target === '6v6' ? MODE_6V6 : MODE_5V5;
      if (newCount === slotCount) return;
      saveProximoMode(newCount);
      renderProximo(root);
    });
  });

  // Lista de opciones para el combobox custom (Jugador nuevo + jugadores alfabético)
  const NUEVO_LABEL = 'Jugador nuevo';
  const COMBO_OPTIONS = [
    { value: NUEVO_LABEL, label: '+ Jugador nuevo', isNew: true },
    ...PLAYERS_LIST.map(n => ({ value: n, label: n, isNew: false })),
  ];

  // Conjunto de nombres válidos para validación rápida (insensible a may/min y espacios).
  const VALID_INPUTS = new Map();
  VALID_INPUTS.set(NUEVO_LABEL.toLowerCase(), NUEVO_LABEL);
  PLAYERS_LIST.forEach(n => VALID_INPUTS.set(n.toLowerCase(), n));

  // Mapeo input value → valor almacenado. Si el texto no matchea un jugador conocido
  // ni la opción "Jugador nuevo", se trata como un jugador nuevo con ese nombre.
  function valueFromInput(raw) {
    const v = (raw || '').trim();
    if (!v) return '';
    const canonical = VALID_INPUTS.get(v.toLowerCase());
    if (canonical === NUEVO_LABEL) return NUEVO_TOKEN;
    if (canonical) return canonical;
    return makeNuevo(v); // nombre tecleado → jugador nuevo nombrado
  }
  // Inverso: valor almacenado → texto a mostrar en el input
  function valueToInput(stored) {
    if (!stored) return '';
    if (stored === NUEVO_TOKEN) return NUEVO_LABEL;
    const n = nuevoNameOf(stored);
    if (n) return n;
    return stored;
  }

  const slotsCard = el(`<div class="card proximo-card"><h3 class="card-title">Slots <span class="badge" id="slots-count">0/${slotCount}</span></h3><div class="slots-grid"></div></div>`);
  const grid = slotsCard.querySelector('.slots-grid');

  function refreshMeta(idx) {
    const slot = slotsCard.querySelector(`.slot[data-idx="${idx}"]`);
    if (!slot) return;
    const value = slots[idx];
    const meta = slot.querySelector('.slot-meta');
    if (!value) { meta.textContent = ''; meta.classList.remove('is-new', 'is-low'); return; }
    if (isNuevo(value)) {
      const fb = effectiveScore(value);
      meta.innerHTML = `Sin partidos · puntaje estimado <strong>${fmtNum(fb.score, 2)}</strong>`;
      meta.classList.add('is-new'); meta.classList.remove('is-low');
      return;
    }
    const fb = effectiveScore(value);
    if (fb.raw) {
      meta.innerHTML = `${fb.pj} PJ · puntaje <strong>${fmtNum(fb.score, 2)}</strong>`;
      meta.classList.remove('is-new', 'is-low');
    } else {
      meta.innerHTML = `${fb.pj} PJ · puntaje regularizado <strong>${fmtNum(fb.score, 2)}</strong>`;
      meta.classList.remove('is-new'); meta.classList.add('is-low');
    }
  }

  function refreshCount() {
    const n = slots.filter(s => !!s).length;
    const badge = slotsCard.querySelector('#slots-count');
    badge.textContent = `${n}/${slotCount}`;
    badge.classList.toggle('complete', n === slotCount);
    armarBtn.disabled = n !== slotCount;
    // Marcar visualmente los slots llenos + racha
    slotsCard.querySelectorAll('.slot').forEach((s, idx) => {
      const value = slots[idx];
      s.classList.toggle('is-filled', !!value);
      // Streak: solo si es un jugador real (no nuevo/vacío) con racha > umbral
      const real = value && !isNuevo(value);
      const winCount = real ? getCurrentWinStreak(value) : 0;
      const loseCount = real ? getCurrentLoseStreak(value) : 0;
      const inStreak = winCount > STREAK_THRESHOLD;
      const inColdStreak = loseCount > STREAK_THRESHOLD;
      s.classList.toggle('on-streak', !!inStreak);
      s.classList.toggle('on-cold-streak', !!inColdStreak);
      // Insertar/actualizar el badge dentro del slot-meta
      const meta = s.querySelector('.slot-meta');
      const existing = s.querySelector('.streak-badge');
      if (inStreak || inColdStreak) {
        const count = inStreak ? winCount : loseCount;
        const cold = !inStreak;
        const wantKey = (cold ? 'C' : 'H') + count;
        if (!existing || existing.dataset.key !== wantKey) {
          if (existing) existing.remove();
          if (meta) {
            const icon = cold ? '\u{1F9CA}' : '\u{1F525}';
            const title = cold ? `Racha de ${count} derrotas` : `Racha de ${count} victorias`;
            const b = el(`<span class="streak-badge${cold ? ' cold' : ''}" data-count="${count}" data-key="${wantKey}" title="${title}">${icon}</span>`);
            meta.appendChild(b);
          }
        }
      } else if (existing) {
        existing.remove();
      }
    });
  }

  for (let i = 0; i < slotCount; i++) {
    const slot = el(`
      <div class="slot" data-idx="${i}">
        <div class="slot-num">${i + 1}</div>
        <div class="combo">
          <input class="slot-input combo-input" type="text" autocomplete="off" spellcheck="false" placeholder="Buscar un jugador o tipear uno nuevo…">
          <button type="button" class="slot-clear" aria-label="Limpiar">×</button>
          <div class="combo-list" hidden></div>
        </div>
        <div class="slot-meta"></div>
      </div>
    `);
    const input = slot.querySelector('.slot-input');
    const clearBtn = slot.querySelector('.slot-clear');
    const list = slot.querySelector('.combo-list');
    input.value = valueToInput(slots[i]);

    function buildList(filter) {
      const raw = (filter || '').trim();
      const f = raw.toLowerCase();
      const filtered = !f
        ? COMBO_OPTIONS
        : COMBO_OPTIONS.filter(o => o.label.toLowerCase().includes(f));
      // Si el usuario tipeó algo que no matchea exactamente nada, ofrecemos crear
      // un "Jugador nuevo" con ese nombre.
      const exactMatch = raw && COMBO_OPTIONS.some(o => o.value.toLowerCase() === f || o.label.toLowerCase() === f);
      const offerCreate = raw && !exactMatch;
      const html = [];
      if (offerCreate) {
        html.push(`<button type="button" class="combo-item is-new" data-create-name="${esc(raw)}">+ Crear nuevo: "${esc(raw)}"</button>`);
      }
      if (filtered.length === 0 && !offerCreate) {
        list.innerHTML = `<div class="combo-empty">Sin resultados</div>`;
        return;
      }
      filtered.forEach(o => {
        html.push(`<button type="button" class="combo-item${o.isNew ? ' is-new' : ''}" data-value="${esc(o.value)}">${esc(o.label)}</button>`);
      });
      list.innerHTML = html.join('');
    }

    function openList() { buildList(input.value); list.hidden = false; }
    function closeList() { list.hidden = true; }

    function commit() {
      const result = valueFromInput(input.value);
      if (result === null) {
        // Texto inválido: rechazar y revertir.
        input.classList.add('invalid');
        setTimeout(() => input.classList.remove('invalid'), 1200);
        input.value = valueToInput(slots[i]);
        return;
      }
      slots[i] = result;
      input.value = valueToInput(slots[i]);
      saveProximoSlots(slots);
      refreshMeta(i);
      refreshCount();
    }

    input.addEventListener('focus', openList);
    input.addEventListener('click', openList);
    input.addEventListener('input', () => {
      buildList(input.value);
      list.hidden = false;
    });
    // mousedown en la lista evita que el input pierda foco antes del click
    list.addEventListener('mousedown', e => e.preventDefault());
    list.addEventListener('click', e => {
      const btn = e.target.closest('.combo-item');
      if (!btn) return;
      if (btn.dataset.createName !== undefined) {
        // Crear "Jugador nuevo" con el nombre tecleado
        const name = btn.dataset.createName;
        slots[i] = makeNuevo(name);
        input.value = valueToInput(slots[i]);
        saveProximoSlots(slots);
        refreshMeta(i);
        refreshCount();
      } else {
        input.value = btn.dataset.value;
        commit();
      }
      closeList();
      input.blur();
    });
    // Cerrar al perder foco (con delay para que el click se procese antes)
    input.addEventListener('blur', () => {
      setTimeout(() => {
        closeList();
        commit();
      }, 120);
    });
    // Tecla Enter: si hay un primer item filtrado, lo elige
    input.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        input.value = valueToInput(slots[i]);
        closeList();
        input.blur();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        const first = list.querySelector('.combo-item');
        if (first) {
          // Delegamos al click handler para que maneje también la opción "crear nuevo"
          first.click();
        } else {
          commit();
          closeList();
        }
      }
    });

    clearBtn.addEventListener('click', e => {
      e.stopPropagation();
      input.value = '';
      commit();
      input.focus();
    });

    grid.appendChild(slot);
  }

  // Botones de acción
  const actions = el(`
    <div class="proximo-actions">
      <button class="btn primary" id="armar-btn" disabled>⚔ Armar equipos</button>
      <button class="btn" id="limpiar-btn">Limpiar</button>
    </div>
  `);
  const armarBtn = actions.querySelector('#armar-btn');
  const limpiarBtn = actions.querySelector('#limpiar-btn');

  // Contenedor de equipos
  const teamsWrap = el(`<div class="teams-wrap" id="teams-wrap"></div>`);

  function buildSelected() {
    let nuevoGenericCount = 0;
    return slots
      .map((s, i) => ({ s, i }))
      .filter(({ s }) => !!s)
      .map(({ s, i }) => {
        const sc = effectiveScore(s);
        const isNew = isNuevo(s);
        let displayName;
        if (isNew) {
          const typed = nuevoNameOf(s);
          if (typed) {
            displayName = typed;
          } else {
            nuevoGenericCount++;
            displayName = `Jugador nuevo ${nuevoGenericCount}`;
          }
        } else {
          displayName = s;
        }
        return {
          slot: i,
          name: displayName,
          rawName: s,
          isNew,
          score: sc.score,
          pj: sc.pj,
          regularized: !sc.raw,
        };
      });
  }

  function renderTeams() {
    teamsWrap.innerHTML = '';
    if (!teams) return;
    const card = (titulo, equipo, mod) => {
      const total = equipo.reduce((a, p) => a + p.score, 0);
      const promedio = equipo.length ? total / equipo.length : 0;
      const node = el(`
        <div class="team team-${mod}">
          <div class="team-head">
            <h3 class="team-title">${esc(titulo)}</h3>
            <div class="team-stats">${equipo.length} jug · prom <strong data-anim-to="${promedio}" data-anim-dec="2">${fmtNum(promedio, 2)}</strong></div>
          </div>
          <ol class="team-list">
            ${equipo.map(p => {
              const inStreak = !p.isNew && getCurrentWinStreak(p.rawName) > STREAK_THRESHOLD;
              const inColdStreak = !p.isNew && getCurrentLoseStreak(p.rawName) > STREAK_THRESHOLD;
              return `
              <li${inStreak ? ' class="on-streak"' : inColdStreak ? ' class="on-cold-streak"' : ''}>
                <span class="team-name">${esc(p.name)}${p.regularized ? ' <em class="team-reg" title="Puntaje regularizado por menos de 5 partidos">·R</em>' : ''}</span>
                <span class="team-score">${fmtNum(p.score, 2)}</span>
              </li>
            `;
            }).join('')}
          </ol>
        </div>
      `);
      return node;
    };
    teamsWrap.appendChild(card('Equipo Blanco', teams.blanco, 'blanco'));
    teamsWrap.appendChild(card('Equipo Negro',  teams.negro,  'negro'));

    // Odómetro en los promedios de cada equipo
    teamsWrap.querySelectorAll('strong[data-anim-to]').forEach(s => {
      animateNumber(s, parseFloat(s.dataset.animTo), { dur: 900, dec: 2 });
    });
  }

  armarBtn.addEventListener('click', () => {
    const sel = buildSelected();
    if (sel.length !== slotCount) return;
    sel.sort((a, b) => b.score - a.score || a.name.localeCompare(b.name));
    teams = snakeAssign(sel);
    renderTeams();
    teamsWrap.scrollIntoView({ behavior: 'smooth', block: 'start' });
  });

  limpiarBtn.addEventListener('click', () => {
    if (!confirm(`¿Limpiar los ${slotCount} slots?`)) return;
    for (let i = 0; i < slotCount; i++) {
      slots[i] = '';
      slotsCard.querySelector(`.slot[data-idx="${i}"] .slot-input`).value = '';
      refreshMeta(i);
    }
    saveProximoSlots(slots);
    teams = null;
    renderTeams();
    refreshCount();
  });

  root.appendChild(slotsCard);
  root.appendChild(actions);

  // Card explicativa del cálculo (usa el patrón actual según modo)
  const pattern = snakePatternFor(slotCount);
  const blancoPositions = pattern.map((t, i) => t === 'B' ? (i + 1) : null).filter(x => x);
  const negroPositions  = pattern.map((t, i) => t === 'N' ? (i + 1) : null).filter(x => x);
  root.appendChild(el(`
    <div class="card proximo-help">
      <h3 class="card-title">Cómo se calcula el puntaje</h3>
      <ul class="help-list">
        <li>Si el jugador tiene <strong>más de 5 partidos</strong>: se usa su puntaje promedio real.</li>
        <li>Si tiene <strong>5 o menos</strong>: se usa <code>(puntos + (5 − PJ) × promedio del resto) / 5</code>, donde <em>"promedio del resto"</em> es el macro-average (promedio de los promedios) de los jugadores con <strong>más de 5 PJ</strong>.</li>
        <li>"Jugador nuevo" entra con <strong>0 partidos / 0 puntos</strong>, equivalente al promedio del resto (>5 PJ). Podés tipear un nombre para distinguirlos en empates (se ordenan alfabéticamente).</li>
        <li>Reparto serpiente: <strong>${blancoPositions.join(', ')}</strong> al Blanco · <strong>${negroPositions.join(', ')}</strong> al Negro.</li>
      </ul>
    </div>
  `));

  root.appendChild(teamsWrap);

  // Inicial
  for (let i = 0; i < slotCount; i++) refreshMeta(i);
  refreshCount();
  renderTeams();
}

// ---------------- Vista: EVOLUCIÓN (bump chart animado) ----------------

// t es un float en [0, N-1]. Avanza con requestAnimationFrame para animación fluida.
let evolState = { t: 0, playing: false, raf: null, lastFrame: 0, focus: null, resizeHandler: null };

const PLAY_DURATION_MS = 14000; // duración de toda la línea de tiempo al reproducir

function renderEvolucion(root) {
  root.innerHTML = '';

  // jugadores que tengan al menos N partidos para que la línea valga la pena
  const minPJ = 3;
  const eligibles = STANDINGS.filter(s => s.pj >= minPJ).map(s => s.jugador);
  const N = MATCHES.length;

  // Para cada partido t (0..N-1), calculamos la tabla acumulada y guardamos el rank de cada jugador.
  // Solo asignamos rank si el jugador ya jugó al menos un partido a esa altura.
  const ranksByPlayer = new Map(eligibles.map(n => [n, []]));

  for (let t = 0; t < N; t++) {
    const tabla = buildStandings(MATCHES, t);
    const filtered = tabla.filter(p => eligibles.includes(p.jugador));
    filtered.sort((a, b) => b.promedio - a.promedio || b.puntos - a.puntos);
    const rankMap = new Map();
    filtered.forEach((p, i) => rankMap.set(p.jugador, { rank: i + 1, pj: p.pj, prom: p.promedio }));

    for (const n of eligibles) {
      const r = rankMap.get(n);
      ranksByPlayer.get(n).push(r ? r : null);
    }
  }

  // Botón "← Volver" (visible solo en modo fullscreen)
  const backBtn = el(`<button class="btn evol-fs-back-btn" id="evol-fs-back">← Volver</button>`);
  backBtn.addEventListener('click', () => {
    document.body.classList.remove('evol-fs');
    setTimeout(() => drawBump(eligibles, ranksByPlayer), 60);
  });
  root.appendChild(backBtn);

  root.appendChild(el(`
    <div class="view-header">
      <div>
        <h1 class="view-title">Evolución en la tabla</h1>
        <div class="view-sub">Cómo subió y bajó cada jugador a lo largo de los ${N} partidos · click en una línea o nombre para resaltarla</div>
      </div>
    </div>
  `));

  // Controles
  const controls = el(`
    <div class="evol-controls">
      <button class="btn primary" id="evol-play">▶ Reproducir</button>
      <button class="btn" id="evol-reset">⟲ Reset</button>
      <button class="btn evol-fs-btn" id="evol-fs">📱 Pantalla completa</button>
      <input type="range" class="evol-slider" id="evol-slider" min="0" max="${N - 1}" step="any" value="${N - 1}">
      <div class="evol-time" id="evol-time"></div>
    </div>
  `);
  root.appendChild(controls);

  const wrap = el(`<div class="bump-wrap"><svg class="bump-svg" id="bump-svg"></svg></div>`);
  root.appendChild(wrap);

  // Botón pantalla completa (mobile)
  controls.querySelector('#evol-fs').addEventListener('click', () => {
    document.body.classList.add('evol-fs');
    setTimeout(() => drawBump(eligibles, ranksByPlayer), 60);
  });

  // Redibujar al rotar el dispositivo o cambiar tamaño (relevante para fullscreen)
  if (evolState.resizeHandler) {
    window.removeEventListener('resize', evolState.resizeHandler);
    window.removeEventListener('orientationchange', evolState.resizeHandler);
  }
  evolState.resizeHandler = () => drawBump(eligibles, ranksByPlayer);
  window.addEventListener('resize', evolState.resizeHandler);
  window.addEventListener('orientationchange', evolState.resizeHandler);

  evolState.t = N - 1;
  evolState.playing = false;
  evolState.focus = null;

  const slider = controls.querySelector('#evol-slider');
  const playBtn = controls.querySelector('#evol-play');
  const resetBtn = controls.querySelector('#evol-reset');

  function setT(t, fromSlider) {
    evolState.t = Math.max(0, Math.min(N - 1, t));
    if (!fromSlider) slider.value = evolState.t;
    drawBump(eligibles, ranksByPlayer);
  }

  slider.addEventListener('input', e => { stopPlay(); setT(parseFloat(e.target.value), true); });

  function startPlay() {
    if (evolState.playing) return;
    if (evolState.t >= N - 1) evolState.t = 0;
    evolState.playing = true;
    playBtn.textContent = '⏸ Pausar';
    evolState.lastFrame = performance.now();

    const speed = (N - 1) / (PLAY_DURATION_MS / 1000); // matches por segundo
    const tick = (now) => {
      if (!evolState.playing) return;
      const dt = Math.min(0.1, (now - evolState.lastFrame) / 1000);
      evolState.lastFrame = now;
      const next = evolState.t + dt * speed;
      if (next >= N - 1) { setT(N - 1); stopPlay(); return; }
      setT(next);
      evolState.raf = requestAnimationFrame(tick);
    };
    evolState.raf = requestAnimationFrame(tick);
  }
  function stopPlay() {
    if (!evolState.playing) return;
    evolState.playing = false;
    playBtn.textContent = '▶ Reproducir';
    if (evolState.raf) cancelAnimationFrame(evolState.raf);
    evolState.raf = null;
  }
  playBtn.addEventListener('click', () => evolState.playing ? stopPlay() : startPlay());
  resetBtn.addEventListener('click', () => { stopPlay(); setT(0); });

  drawBump(eligibles, ranksByPlayer);
}

// Paleta para las líneas — repartida por hash del nombre
const LINE_COLORS = [
  '#1ec3c3', '#4ade80', '#f5b454', '#a78bfa', '#f87171',
  '#60a5fa', '#fb923c', '#34d399', '#f472b6', '#facc15',
  '#22d3ee', '#c084fc', '#fb7185', '#84cc16', '#06b6d4',
  '#e879f9', '#fde047', '#10b981', '#f43f5e', '#3b82f6',
];

function colorFor(name) {
  let h = 0;
  for (let i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) >>> 0;
  return LINE_COLORS[h % LINE_COLORS.length];
}

function drawBump(players, ranks) {
  const svg = document.getElementById('bump-svg');
  if (!svg) return;
  const N = MATCHES.length;
  const t = evolState.t;
  const intT = Math.floor(t);
  const frac = t - intT;

  const fsActive = document.body.classList.contains('evol-fs');
  const portraitMobile = window.matchMedia('(max-width: 760px) and (orientation: portrait)').matches;
  const isMobile = window.matchMedia('(max-width: 760px)').matches;
  const numPlayers = players.length;

  // Padding del chart dentro del SVG. Más compacto en FS para no perder pixeles.
  const padding = {
    top: fsActive ? 10 : 20,
    right: fsActive ? 110 : (isMobile ? 130 : 200),
    bottom: fsActive ? 20 : 36,
    left: fsActive ? 22 : (isMobile ? 32 : 40),
  };

  // En FS portrait mobile, la vista está rotada 90°: el ancho lógico del SVG
  // corresponde al alto físico del viewport, y viceversa. Restamos margen para
  // controles + back + paddings.
  let width, height;
  if (fsActive && portraitMobile) {
    width = window.innerHeight - 16;
    height = window.innerWidth - 92;
  } else if (fsActive) {
    width = window.innerWidth - 16;
    height = window.innerHeight - 92;
  } else {
    width = Math.max(800, svg.parentElement.clientWidth - 36);
    height = numPlayers * 22 + padding.top + padding.bottom;
  }
  const innerW = width - padding.left - padding.right;
  const rowH = fsActive
    ? Math.max(9, (height - padding.top - padding.bottom) / Math.max(1, numPlayers))
    : 22;
  const innerH = numPlayers * rowH;
  if (fsActive) height = innerH + padding.top + padding.bottom;

  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  svg.setAttribute('width', width);
  svg.setAttribute('height', height);
  svg.innerHTML = '';

  // Click sobre el fondo limpia el foco.
  const bg = svgEl('rect', { x: 0, y: 0, width, height, fill: 'transparent' });
  bg.addEventListener('click', () => {
    if (evolState.focus !== null) { evolState.focus = null; drawBump(players, ranks); }
  });
  svg.appendChild(bg);

  // Eje X fijo: cubre toda la línea de tiempo (no se re-escala al reproducir).
  const xFor   = tt => padding.left + (N > 1 ? (tt / (N - 1)) * innerW : innerW / 2);
  const yFor   = rank => padding.top + (rank - 1) * rowH + rowH / 2;

  // Ticks por mes (todos los meses de toda la timeline)
  const ticks = [];
  let lastMonth = '';
  for (let tt = 0; tt < N; tt++) {
    const f = MATCHES[tt].fecha;
    const m = f.slice(0, 7);
    if (m !== lastMonth) { ticks.push({ tt, fecha: f }); lastMonth = m; }
  }
  ticks.forEach(({ tt, fecha }) => {
    const x = xFor(tt);
    const lbl = `${MESES[parseInt(fecha.slice(5,7),10) - 1]} ${fecha.slice(2,4)}`;
    svg.appendChild(svgEl('line', { x1: x, x2: x, y1: padding.top, y2: padding.top + innerH, stroke: '#1f3a52', 'stroke-dasharray': '2 4', opacity: 0.4 }));
    svg.appendChild(svgEl('text', { x, y: padding.top + innerH + 18, 'text-anchor': 'middle', class: 'bump-axis' }, lbl));
  });

  // Cabezal vertical (sólo mientras se reproduce o el slider no está al final)
  if (t > 0 && t < N - 1) {
    const xh = xFor(t);
    svg.appendChild(svgEl('line', {
      x1: xh, x2: xh, y1: padding.top - 4, y2: padding.top + innerH + 4,
      stroke: '#1ec3c3', opacity: 0.35, 'stroke-width': 1
    }));
  }

  const focus = evolState.focus;

  function toggleFocus(name) {
    evolState.focus = (evolState.focus === name) ? null : name;
    drawBump(players, ranks);
  }

  for (const name of players) {
    const arr = ranks.get(name);

    // Construye la lista de puntos (x, y) de la línea: todos los rangos enteros hasta intT,
    // más un punto interpolado entre intT y intT+1 según frac.
    const pts = [];
    for (let tt = 0; tt <= intT; tt++) {
      if (arr[tt]) pts.push({ x: xFor(tt), y: yFor(arr[tt].rank), rank: arr[tt].rank });
    }
    let headPt = pts.length ? pts[pts.length - 1] : null;
    if (intT < N - 1 && frac > 0) {
      const r1 = arr[intT], r2 = arr[intT + 1];
      if (r1 && r2) {
        const x = xFor(intT) + frac * (xFor(intT + 1) - xFor(intT));
        const y = yFor(r1.rank) + frac * (yFor(r2.rank) - yFor(r1.rank));
        const rk = (frac < 0.5) ? r1.rank : r2.rank;
        pts.push({ x, y, rank: rk });
        headPt = { x, y, rank: rk };
      } else if (!r1 && r2 && frac >= 0.5) {
        // Jugador entrando en escena — aparece a mitad de transición.
        const x = xFor(intT + 1);
        const y = yFor(r2.rank);
        pts.push({ x, y, rank: r2.rank });
        headPt = { x, y, rank: r2.rank };
      }
    }
    if (pts.length === 0) continue;

    const color = colorFor(name);
    const cls = focus === null ? '' : (focus === name ? 'highlight' : 'dim');
    const d = pts.map((p, i) => (i === 0 ? 'M' : 'L') + p.x.toFixed(1) + ',' + p.y.toFixed(1)).join(' ');

    const path = svgEl('path', { d, stroke: color, class: `bump-line ${cls}` });
    path.style.cursor = 'pointer';
    path.addEventListener('click', e => { e.stopPropagation(); toggleFocus(name); });
    svg.appendChild(path);

    if (headPt) {
      // Nombre que sigue la cabeza de la línea — reemplaza al dot + label fija.
      // Sigue al head interpolado tanto en X como en Y para mantenerse "anclado"
      // al extremo del path durante la animación.
      // Si el jugador está enfocado, mostramos el nombre completo; si no, el corto.
      const display = focus === name ? name : shortName(name);
      const labelX = headPt.x + 8;
      const labelY = headPt.y + 4;

      const lbl = svgEl('text', {
        x: labelX.toFixed(1), y: labelY.toFixed(1),
        class: `bump-label ${cls}`,
        fill: color,
      }, `${headPt.rank}. ${display}`);
      lbl.addEventListener('click', e => { e.stopPropagation(); toggleFocus(name); });
      svg.appendChild(lbl);
    }
  }

  // Etiqueta de tiempo
  const timeEl = document.getElementById('evol-time');
  if (timeEl) {
    const idx = Math.min(N - 1, Math.round(t));
    const cur = MATCHES[idx];
    timeEl.innerHTML = `Partido <strong>${idx + 1}/${N}</strong><br>${esc(fmtFecha(cur.fecha))}`;
  }
}

function svgEl(tag, attrs = {}, text) {
  const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v === undefined || v === null) continue;
    e.setAttribute(k, v);
  }
  if (text !== undefined) e.textContent = text;
  return e;
}

</script>
</body>
